[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgclient"
version = "0.1.0"
description = "Cross-platform Telegram client built on TDLib and PySide6"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "platformdirs>=4",
    "python-dotenv>=1",
    "PySide6>=6.9",
    "qasync>=0.27",
    # System notifications: UserNotifications on macOS, org.freedesktop.Notifications on Linux.
    "pyobjc-framework-UserNotifications>=10; sys_platform == 'darwin'",
    "jeepney>=0.8; sys_platform == 'linux'",
    # M9: Opus voice notes and WebM (VP9 + alpha) stickers via FFmpeg with libopus/libvpx;
    # TGS (Lottie) stickers; QR codes for login.
    "av>=15.1",
    "rlottie-python>=1.3.8",
    "segno>=1.6",
    "keyring>=25",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
# Meaning-based search: local multilingual embeddings (ONNX). Without it search is keyword-only.
semantic = ["fastembed>=0.5"]
# Building .dmg / AppImage / Flatpak (see packaging/).
package = ["pyinstaller>=6.10"]

[project.scripts]
tgclient = "tgclient.app:main"
tgclient-cli = "tgclient.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tgclient"]
artifacts = ["src/tgclient/_build.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
